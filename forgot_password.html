<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawn & Sea - Récupération de mot de passe</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/CSS/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/CSS/login.css">
    <style>
        fieldset {
            margin-top: 40px !important;
            margin-bottom: 30px !important;
        }
        @media (min-width: 768px) {
            fieldset {
                margin-top: 140px !important;
                margin-bottom: 50px !important;
            }
        }
        .form-control-custom {
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container-fluid px-0">
            <nav class="navbar navbar-expand-md navbar-dark bg-dark p-2">
                <img src="IMG/4-removebg-preview.png" alt="Mon Logo" class="navbar-brand logo-navbar">
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#x">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div id="x" class="collapse navbar-collapse w-100 justify-content-center"></div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container d-flex justify-content-center">
            <fieldset class="bg-dark">
                <legend>RÉCUPÉRATION DU MOT DE PASSE</legend>
                <form id="FORGOT-PASSWORD">
                    <label for="email" class="form-label">Email :</label>
                    <div class="mb-3">
                        <input type="email" class="form-control form-control-custom" id="email" name="email" required placeholder="votre email">
                    </div>

                    <label for="date_naissance" class="form-label">Date de naissance :</label>
                    <div class="mb-3">
                        <input type="date" class="form-control form-control-custom" id="date_naissance" name="date_naissance" required>
                    </div>

                    <label for="pays_naissance" class="form-label">Pays de naissance :</label>
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-custom" id="pays_naissance" name="pays_naissance" required placeholder="Ex: Algérie">
                    </div>

                    <label for="password" class="form-label">Nouveau mot de passe :</label>
                    <div class="mb-3">
                        <input type="password" class="form-control form-control-custom" id="password" name="password" required placeholder="nouveau mot de passe">
                    </div>

                    <label for="password_confirmation" class="form-label">Confirmer le mot de passe :</label>
                    <div class="mb-3">
                        <input type="password" class="form-control form-control-custom" id="password_confirmation" name="password_confirmation" required placeholder="confirmer le mot de passe">
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-warning text-dark fw-bold px-4">RÉINITIALISER</button>
                        <a href="login.html" class="btn btn-danger px-4 ms-2">ANNULER</a>
                    </div>
                </form>
            </fieldset>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="text-light bg-dark mt-3">&copy; 2025 Dawn & Sea. Tous droits réservés.</p>
    </footer>

    <!-- JS Scripts -->
    <script src="assets/JS/bootstrap.bundle.min.js"></script>
    <script src="assets/JS/main.js"></script>
</body>
</html>
